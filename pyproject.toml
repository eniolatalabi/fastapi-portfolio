[project]
name = "fastapi-portfolio"
version = "0.1.0"
description = "JWT-authenticated social media API and utility services, with a full test suite and CI."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.18.3",
    "bcrypt==4.0.1",
    "email-validator>=2.3.0",
    "fastapi>=0.128.0",
    "gunicorn>=25.1.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg2-binary>=2.9.11",
    "pydantic-settings>=2.12.0",
    "pydantic[email]>=2.12.5",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.21",
    "sqlalchemy>=2.0.45",
    "uvicorn>=0.40.0",
]

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    # Upstream notices outside this project's control:
    "ignore:'crypt' is deprecated:DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient`:Warning",
]
